name: Build and Release ESP-IDF Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest component dependencies
        run: |
          rm -f dependencies.lock
          rm -f main/dependencies.lock

      - name: Build project for ESP32-C3
        run: |
          . "$IDF_PATH/export.sh"
          cat > sdkconfig.ci.defaults <<'EOF'
          CONFIG_BT_ENABLED=y
          CONFIG_BT_NIMBLE_ENABLED=y
          CONFIG_BT_BLUEDROID_ENABLED=n
          CONFIG_BT_CONTROLLER_ENABLED=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          EOF
          if [ -f sdkconfig.defaults ]; then
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.defaults"
          else
            export SDKCONFIG_DEFAULTS="sdkconfig.ci.defaults"
          fi
          idf.py set-target esp32c3
          idf.py reconfigure
          idf.py build
          
      - name: Merge binaries
        run: |
          . "$IDF_PATH/export.sh"
          idf.py merge-bin
      - name: Collect build outputs
        run: |
          mkdir -p dist
          cp build/*.bin dist/
          cp build/bootloader/bootloader.bin dist/ || true
          cp build/partition_table/partition-table.bin dist/ || true
          cp build/*.elf dist/
          cp build/*.map dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32c3-firmware
          path: dist

      - name: Create GitHub release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
